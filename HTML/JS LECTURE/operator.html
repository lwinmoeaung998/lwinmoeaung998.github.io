<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Operator</h1>

    <script>
        //assign operator =
        let name = 'Lwin Moe Aung';
        console.log(name);

        //Additional operator + 
        let number = 4 + 5;
        console.log(number);

        //variable addtional
        let number1 = 3000;
        let number2 = 4000;
        let number3 = number1 + number2;
        console.log(number3);

        //+1 addtional
        let num = 10;
        //num = num + 1;
        num += 1;
        console.log(num);

        let numOne = 10;
        //numOne++;

        //AFTER PROCESS
        console.log(numOne++);
        //BEFORE PROCESS
        console.log(numOne);




        //Substraction Operator-
        let num4 = 10;
        console.log(--num4);

        let num5 = 15;
        num5 -= 3;
        console.log(num5);

        let num6 = 20;
       // num6--;
        console.log(num6--);




        //Multiplication Operator*
        let num7 = 10;
       // num7 *= 5;
       //num7 = num7 * 5;
        console.log(num7);


        //Division operator/
        let num8 = 10;
        //num8 /= 5;
        num8 = num8 / 5;
        console.log(num8);

       //remainder operator %
       let num9 = 10;
       num9 %= 2;
       console.log(num9);

       //exponent operator
       let num10 = 2;
      // num10 **= 2;
      num10 = num10 ** 3;
       console.log(num10);

       //presendence operator
       let result = (9+5) - 8 * 5 / 2 % 3;
       console.log(result);












    </script>
</body>

</html>
