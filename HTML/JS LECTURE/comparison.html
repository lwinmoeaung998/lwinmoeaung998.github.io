<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Comparison</h1>
    <script>
        //greater than operator
        let num1 = '10';
        let num2 = 10;
        console.log(num1 > num2);

        //greater than operator or equal operator
        console.log(num1 >= num2);

        //less than operator
        console.log(num1 < num2);
        console.log(num2 <= num1);

        //equal to operator
        console.log(num1 ==num2);

        //equal to operator and data type
        console.log(num1===num2);

        //not equal to operator
        console.log(num1 !=num2);

        //not equal to operator and data type
        console.log(num1 !==num2);



       





    </script>
</body>
</html>
