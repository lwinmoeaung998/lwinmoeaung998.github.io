<body>
    <h1>Condition Lessons</h1>

    <script>
        let num = prompt("Enter a number");
        if(num<10){
            document.write("exotic flowers");

        }else if(num == 10){
            document.write("bud press");
        }else{
            document.write('third eye')
        }




    </script>
    
</body>
