<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="myId">Dom Lesson</h1>
    <p class="myClass">My class one</p>
    <p class="myClass">My class two</p>
    <p class="myClass">My class three</p>


    <script>
        //id selector

        let myId =document.getElementById("myId")
        console.log(myId)
        document.write(myId.innerText);
        document.write("<br>")
        document.write(myId.innerText);


        //class selector

        let myClass = document.getElementsByClassName("myClass ")
        console.log(myClass[1].innerText)

        //query selector
        let myQueryId = document.querySelector("#myId");
        console.log(myQueryId.innerText)

        let myQueryClass = document.querySelector(".myClass")
        console.log(myQueryClass.innerText);

      //tag selector 
      let myTag = document.getElementsByTagName("p");
      console.log(myTag[2].innerText);

      //querySelectorAll
      let myALL = document.querySelectorAll(".myClass");
      console.log(myALL[0].innerText);
       

     

    </script>
</body>

</html>
