<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Data Types</h1>
    <script>


        //String data type
        let name = "Lwin Moe Aung";
        console.log(name);
        console.log(typeof (name));

        //Numbric Data type
        let num = 10;
        console.log(num);
        console.log(typeof (num));

        //boolean data type (true or false)
        let stuDent = true;
        console.log(stuDent);
        console.log(typeof (stuDent));

        //Underfined Data Type
        let fatherName;
        console.log(fatherName);
        console.log(typeof (fatherName));

        //null data type
        let lwin = null;
        console.log(lwin);
        console.log(typeof (lwin));




        //ARRAY DATA TYPE (START FROM 0)
        //let studentList = new Arrey('mg mg','aung aung',hla hla');
        let studentList = ['mg mg', 'aung aung', 'hla hla'];

        console.log(studentList);
        console.log(typeof (studentList));
        console.log(studentList.length);
        console.log(studentList[1]);








        //OBJECT DATA TYPE
        
        let student = {
            // key : value
            name: "Lwin Moe Aung",
            age: 28,
            address: "heaven",
            education: "Oxford University"
        }
        console.log(student);
        console.log(typeof (student));
        console.log(student.education);



    </script>
</body>

</html>
