<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h1>Invoice</h1>
<table border="1" cellspacing="0" cellpadding="30">
    <thead>
        <tr>
            <th>NO</th>
            <th>Item Name</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Amount</th>
        </tr>

    <tbody>
        <tr>
            <td>1</td>
            <td>Signal</td>
            <td>9000</td>
            <td>1</td>
            <td>9000</td>
        </tr>
        <tr>
            <td>2</td>
             <td>Bubble</td>
             <td>12500</td>
             <td>1</td>
             <td>12500</td>
       
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <th colspan="4">Total</th>
            <th>33500</th>
        </tr>

        <tr>
            <th>Months</th>

        </tr>

    <tbody>
        <tr>
            <td>January</td>

            <td>10000</td>
